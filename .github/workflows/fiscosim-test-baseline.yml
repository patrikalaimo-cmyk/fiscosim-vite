name: FiscoSim Test Baseline

on:
  push:
    branches:
      - mio-branch
      - security/p0-isolated-hardening-20261008
      - feat/studio-grade-accounting-e2e-20261010
  pull_request:
    branches:
      - mio-branch
      - security/p0-isolated-hardening-20261008
      - feat/studio-grade-accounting-e2e-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-node-baseline:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import suite
        run: npm run test:import

      - name: Manual accounting suite
        run: npm run test:manual

      - name: Consultation read-only suite
        run: npm run test:consultazione

      - name: VAT registers and liquidation suite
        run: npm run test:iva

      - name: Split payment simple suite
        run: npm run test:split

      - name: Withholding and deadlines suite
        run: npm run test:ritenute

      - name: Accounting print and export suite
        run: npm run test:stampe

      - name: Bank reconciliation canonical safety suite
        run: npm run test:bank

      - name: Core suite
        run: npm run test:core

      - name: All safe suites
        run: npm run test:all

      - name: Validate local security PowerShell syntax (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $paths = @(
            'scripts/security_p0/run-stage3n.ps1',
            'scripts/security_p0/run-stage3p-preflight.ps1',
            'scripts/security_p0/run-stage3p-foundation.ps1',
            'scripts/security_p0/run-stage3s-full-lab.ps1',
            'scripts/security_p0/run-stage3u-accounting-preflight.ps1',
            'scripts/security_p0/run-stage3u-persistent-lab-install.ps1',
            'scripts/security_p0/run-stage3u-rehearsal-rollback.ps1',
            'scripts/security_p0/run-stage3w-fiscal-preflight.ps1',
            'scripts/security_p0/run-stage3w-fiscal-rehearsal-rollback.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$syntaxErrors
            ) | Out-Null
            if ($syntaxErrors -and $syntaxErrors.Count -gt 0) {
              $syntaxErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax invalid: $path"
            }
            Write-Host "PowerShell parser PASS: $path"
          }

      - name: Production build
        run: npm run build
