name: FiscoSim Test Baseline

on:
  push:
    branches:
      - mio-branch
  pull_request:
    branches:
      - mio-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-node-baseline:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Import suite
        run: npm run test:import

      - name: Manual accounting suite
        run: npm run test:manual

      - name: Consultation read-only suite
        run: npm run test:consultazione

      - name: VAT registers and liquidation suite
        run: npm run test:iva

      - name: Split payment simple suite
        run: npm run test:split

      - name: Core suite
        run: npm run test:core

      - name: All safe suites
        run: npm run test:all

      - name: Production build
        run: npm run build
